<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Knechtgarten Mail-Assistent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 13px; color: #232B35; width: 280px;
  }
  .header { background: #323E4E; color: #fff; padding: 14px 16px; }
  .header-sub { font-size: 10px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1.5px; }
  .header-title { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #F5F7F9; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #323E4E; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7FA84F; flex-shrink: 0; }
  .hint { font-size: 11.5px; color: #8B9097; line-height: 1.5; }
  a.btn {
    display: block; text-align: center; text-decoration: none; background: #323E4E; color: #fff;
    border-radius: 8px; padding: 10px; font-size: 12.5px; font-weight: 700;
  }
  a.btn:hover { background: #4C5C70; }
  a.link { font-size: 11.5px; color: #323E4E; text-decoration: underline; }
</style>
</head>
<body>
<div class="header">
  <div class="header-sub">Knechtgarten</div>
  <div class="header-title">Mail-Assistent</div>
</div>
<div class="body">
  <div class="status"><span class="dot"></span>Aktiv in Gmail</div>
  <div class="hint">Öffne eine Mail zum Verfassen oder Antworten – der Button „Mail-Assistent" erscheint direkt in der Toolbar.</div>
  <a class="btn" href="https://mail.google.com" target="_blank">Gmail öffnen</a>
  <a class="link" href="https://knechtgarten.com/mailassistent-verwaltung-live-v1.html" target="_blank">Zur Verwaltung</a>
</div>
</body>
</html>
